services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
    ports:
      - "${PGHOST:?set PGHOST in .env}:${PGPORT:?set PGPORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    pull_policy: build
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?set PGDATABASE in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    pull_policy: build
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?set PGDATABASE in .env}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "${API_PUBLISH_HOST:?set API_PUBLISH_HOST in .env}:${API_PUBLISH_PORT:?set API_PUBLISH_PORT in .env}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.API_PORT + '/health/ready').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
