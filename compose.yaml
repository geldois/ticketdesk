services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in the environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in the environment}
      PGDATABASE: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
