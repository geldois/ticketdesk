services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
    ports:
      - "${PGHOST:?set PGHOST in .env}:${PGPORT:?set PGPORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?set PGDATABASE in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
